# Builds the release APKs.
#
# This exists because Windows Smart App Control blocks Flutter's `gen_snapshot`
# — an unsigned binary — on the machine this project was developed on, which
# makes a local ARM release build impossible without an irreversible security
# change. An Ubuntu runner has no such restriction.
#
# It also serves as a real check: analyzer, tests and the project's guards all
# run before anything is packaged, so a broken build never produces an artifact.

name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight build of the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version the project was developed and tested against.
  # Floating on "stable" means a Flutter release can break the build on a day
  # nobody touched the code.
  FLUTTER_VERSION: 3.47.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: shelflife_app
        run: flutter pub get

      - name: Analyze
        working-directory: shelflife_app
        run: flutter analyze

      - name: Test
        working-directory: shelflife_app
        # Goldens are excluded deliberately: they are font-rasterisation
        # dependent and the committed images were rendered on Windows, so they
        # fail here for reasons unrelated to the code. Everything else runs —
        # engines, repositories, sync queue, seed contract and the copy rules.
        run: flutter test --exclude-tags golden

      - name: Design and data guards
        run: |
          python tools/check_contrast.py
          python tools/check_asset_coverage.py

      # Release signing.
      #
      # This matters more than it looks. Without a keystore, Gradle falls back
      # to a debug key -- and a GitHub runner generates its OWN debug keystore,
      # different from any developer machine and potentially different per run.
      # Google ties an Android OAuth client to a specific signing certificate,
      # so a debug-signed CI build fails Google sign-in no matter which SHA-1
      # you registered. A stable release key is the only way to make sign-in
      # work on a CI-built APK.
      #
      # Absent secrets are not an error: the build falls back to debug signing
      # and says so, which is fine for checking that the code compiles.
      - name: Decode the release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing keystore. Building debug-signed -- Google sign-in will NOT work on this APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > shelflife_app/android/release.jks
          # printf, not a heredoc: inside a YAML block scalar a heredoc keeps
          # the YAML indentation, and every line of key.properties would arrive
          # with leading spaces.
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > shelflife_app/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # The three values below are all meant to ship inside a client app: the
      # Supabase publishable key is protected by row-level security, and the
      # Google *web client id* is public by design. The Google client SECRET is
      # not among them — that lives in Supabase and must never reach a build.
      #
      # Missing GOOGLE_WEB_CLIENT_ID is not an error: the app builds and simply
      # hides the Google button.
      - name: Build release APKs
        working-directory: shelflife_app
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Audit the APK
        # Resolves the manifest's launcher activity against the dex, checks the
        # dart-defines actually landed, and refuses to pass if any secret
        # material is inside the file. A build that fails this must not ship.
        run: |
          python tools/audit_apk.py \
            shelflife_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Report the signing fingerprint
        # Printed so the SHA-1 registered with Google can be checked against
        # what actually signed the APK -- the mismatch that silently breaks
        # Google sign-in.
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          APK=shelflife_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-1" || true
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            echo "::warning::Debug-signed. Register this SHA-1 with Google, or add the signing secrets."
          fi

      - name: Remove the keystore from the runner
        if: always()
        # Belt and braces: runners are ephemeral, but a key should never be
        # left lying about even for a few seconds after it is needed.
        run: |
          rm -f shelflife_app/android/release.jks
          rm -f shelflife_app/android/key.properties

      - name: Name the artifacts for humans
        run: |
          mkdir -p dist
          cd shelflife_app/build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk    "$GITHUB_WORKSPACE/dist/shelflife.apk"
          cp app-armeabi-v7a-release.apk  "$GITHUB_WORKSPACE/dist/shelflife-older-phones.apk"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shelflife-apk
          path: dist/*.apk
          # Long enough to be useful, short enough not to hoard 90MB forever.
          retention-days: 30
          if-no-files-found: error
